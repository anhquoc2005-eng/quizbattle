# PostgreSQL cho môi trường dev. Production dùng Supabase (xem CLAUDE.md, mục Môi trường và Deploy).
# Chạy: docker compose up -d   (đọc biến từ file .env ở gốc repo)
services:
  db:
    image: postgres:16-alpine
    container_name: quizbattle-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quizbattle}
      POSTGRES_USER: ${POSTGRES_USER:-quizbattle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Hay dat POSTGRES_PASSWORD trong file .env}
    ports:
      # Map sang 5433 ở host để tránh trùng cổng với PostgreSQL cài sẵn (native) trên máy dev, nếu có.
      - "5433:5432"
    volumes:
      - quizbattle-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  quizbattle-db-data:
